version: '3.8'

services:
  # 1. FastAPI Poslužitelj
  api:
    build: .
    container_name: docubrain_api
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./docs:/app/docs
      - ./chroma_db:/app/chroma_db
    restart: always

  # 2. Streamlit Sučelje
  ui:
    build: .
    container_name: docubrain_ui
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_STREAM_URL=http://api:8000/api/v1/query-stream
    depends_on:
      - api
    restart: always

  # 3. Watcher za automatsko indeksiranje mapa
  watcher:
    build: .
    container_name: docubrain_watcher
    command: python folder_watcher.py
    env_file:
      - .env
    volumes:
      - ./docs:/app/docs
    depends_on:
      - api
    restart: always